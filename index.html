<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة السنيك الكلاسيكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-card {
            background-color: #242432;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #2ecc71;
        }
        .score-board {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #gameCanvas {
            background-color: #121218;
            border: 2px solid #2ecc71;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0b0;
        }
        button {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #2ecc71;
            color: #121218;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>لعبة السنيك</h1>
        <div class="score-board">النتيجة: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls-hint">استخدم أسهم الكيبورد (أو W A S D) للتحكم</div>
        <button onclick="resetGame()">إعادة اللعب</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let dx = gridSize;
        let dy = 0;
        let foodX = 0;
        let foodY = 0;
        let score = 0;
        let gameInterval = null;
        let isGameOver = false;

        function initGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            isGameOver = false;
            scoreDisplay.innerText = score;
            generateFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(mainLoop, 100);
        }

        function mainLoop() {
            if (isGameOver) return;
            
            clearCanvas();
            moveSnake();
            checkCollision();
            
            if (!isGameOver) {
                drawFood();
                drawSnake();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = "#121218";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#2ecc71" : "#27ae60";
                ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === foodX && head.y === foodY) {
                score += 10;
                scoreDisplay.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount) * gridSize;
            foodY = Math.floor(Math.random() * tileCount) * gridSize;

            // التأكد من عدم ظهور الطعام فوق جسم السنيك
            snake.forEach(part => {
                if (part.x === foodX && part.y === foodY) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(foodX, foodY, gridSize - 2, gridSize - 2);
        }

        function checkCollision() {
            const head = snake[0];

            // الاصطدام بالجدران
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
            }

            // الاصطدام بالجسم
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#e74c3c";
            ctx.font = "bold 30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px sans-serif";
            ctx.fillText("اضغط 'إعادة اللعب' لبدء جولة جديدة", canvas.width / 2, canvas.height / 2 + 30);
        }

        function resetGame() {
            initGame();
        }

        // التفاعل مع أسهم الكيبورد
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.key;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if ((keyPressed === "ArrowLeft" || keyPressed === "a" || keyPressed === "A") && !goingRight) {
                dx = -gridSize;
                dy = 0;
            } else if ((keyPressed === "ArrowUp" || keyPressed === "w" || keyPressed === "W") && !goingDown) {
                dx = 0;
                dy = -gridSize;
            } else if ((keyPressed === "ArrowRight" || keyPressed === "d" || keyPressed === "D") && !goingLeft) {
                dx = gridSize;
                dy = 0;
            } else if ((keyPressed === "ArrowDown" || keyPressed === "s" || keyPressed === "S") && !goingUp) {
                dx = 0;
                dy = gridSize;
            }
        }

        // بدء اللعبة تلقائياً عند فتح الصفحة
        initGame();
    </script>
</body>
</html>
